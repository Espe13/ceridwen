site_name: CERIDWEN
site_description: JAX-native, GPU-capable spectral energy distribution (SED) fitting
site_url: https://www.amanda-stoffers.de/ceridwen/
repo_url: https://github.com/Espe13/ceridwen
repo_name: Espe13/ceridwen
docs_dir: docs

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    # Night-sky dark is the default, matching amanda-stoffers.de.
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - 'Tutorial: joint fit': tutorial.md
  - Conventions & gotchas: conventions.md
  - API reference: api.md
