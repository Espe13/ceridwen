[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceridwen"
version = "1.0.9"
description = "JAX-native, GPU-capable Bayesian SED fitting with nested sampling and VI-preconditioned HMC"
readme = "README.md"
# Python 3.11+ required: blackjax >= 1.6 (nested sampling) and jax >= 0.9 both
# require it.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amanda Stoffers", email = "aas208@cam.ac.uk" }]
keywords = ["astronomy", "astrophysics", "SED fitting", "Bayesian inference",
            "nested sampling", "HMC", "JAX", "GPU", "stellar populations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies.  These are everything needed for
# ``import ceridwen`` and the README quick-start (forward model, priors,
# default NUTS/nested sampling, HDF5 I/O) to work on a clean environment.
#
# Every dependency is a normal PyPI requirement (no direct git references), so
# ceridwen itself can be published on PyPI.  Notably:
#   * blackjax>=1.6 -- the first release with nested sampling (blackjax.nss /
#                     blackjax.ns). Its blackjax/ns/ is byte-identical to the
#                     commit ceridwen used to pin (f73e12956). It sets the floors
#                     below.
#   * jax/jaxlib>=0.9.0, scipy>=1.13, optax>=0.2.3 -- required by blackjax 1.6;
#                     numpy>=2.0 and scipy>=1.13 -- required by jax 0.9 itself
#                     (jax 0.9.0 setup.py).
#
# Floors policy: a lower bound is a version we have RUN, not a guess.  jax 0.9.0
# and blackjax 1.6 were tested from the built wheel in a clean venv on 2026-09-23
# (FSPS-free suite + T3); the remaining floors below are the versions of the
# validated ceridwen311 environment (see the reference-state note), rounded down
# to the minor.  They were NOT exercised at their floor -- they are declared as
# "known to work at or above", which is what a lower bound means here.  Do not
# lower any of them without running the suite at the new value: numpy>=2.0 is
# now mandatory via jax, and the pre-numpy-2 releases of astropy / h5py /
# matplotlib / tensorflow-probability are not compatible with it.
#   * tensorflow-probability -- every prior uses tfp.substrates.jax, and
#                     ceridwen/__init__.py patches jax.interpreters.xla back in
#                     for it; that shim is written against tfp 0.25 on jax 0.9+.
dependencies = [
    # GPU by default where CUDA exists: on Linux the CUDA 12 jaxlib wheels are
    # installed (CUDA libraries bundled -- a recent enough NVIDIA driver is the
    # only system requirement; jax's install page states the current minimum,
    # which rose after the CUDA 12.0 wheels of jax 0.4.x).  JAX picks the GPU automatically at import time; on
    # a Linux box WITHOUT a usable NVIDIA GPU the same install falls back to
    # CPU at runtime (one warning at import, identical results).  macOS and
    # native Windows have no CUDA wheels, so they get the CPU build; Windows
    # users with an NVIDIA GPU should install inside WSL2 (which is Linux, so
    # the CUDA path applies).  The fitSED header "Device : ..." shows which
    # backend a fit is actually using.
    "jax[cuda12]>=0.9.0; sys_platform == 'linux'",
    "jax>=0.9.0; sys_platform != 'linux'",
    "jaxlib>=0.9.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",   # numpy-2 era; tested version not recorded, see note above
    "h5py>=3.16",
    "astropy>=8.0",
    "tensorflow-probability>=0.25",
    "blackjax>=1.6",
    "tqdm>=4.65",
    # Everything needed to import, fit, plot, and test CERIDWEN is core, so a
    # plain `pip install .` gives a fully-featured install with no extras to
    # choose. (VI + nested-sampling plotting + the test runner are all here.)
    "optax>=0.2.3",       # VI (NeuTra) preconditioning training loop
    "anesthetic>=2.14",   # nested-sampling posteriors, evidence, corner plots
    "pytest>=7.0",        # test runner (so `pytest` works with no extra install)
]

# The ONE thing that cannot be a core dependency is FSPS (`python-fsps`): it is
# not a pure-Python wheel — it compiles Fortran against $SPS_HOME at install
# time, so bundling it would make `pip install` fail on any machine without a
# Fortran compiler and $SPS_HOME set. FSPS is a documented prerequisite instead
# (see the README "Installing FSPS" section): install it with `pip install fsps`.

[project.optional-dependencies]
# Maintainer-only: tooling to build the documentation site. Not needed to use
# or test CERIDWEN.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "black>=24.0"]

[project.urls]
Homepage = "https://github.com/Espe13/ceridwen"
Documentation = "https://www.amanda-stoffers.de/ceridwen/"
Source = "https://github.com/Espe13/ceridwen"
Issues = "https://github.com/Espe13/ceridwen/issues"

[tool.setuptools.packages.find]
# Ship only the importable package; keep scripts/, tests/, notebooks/,
# animation/, presentations/, Method_Paper/, etc. out of the wheel.
include = ["ceridwen*"]
exclude = ["tests*", "scripts*", "notebooks*", "animation*", "presentations*", "GPU*"]

[tool.setuptools.package-data]
# Do NOT bundle the 178 MB ceridwen/data/test_data/*.h5 grids into the wheel.
# The filter curves and the two reference spectra ARE required: since v1.0.0
# the filter and attenuation machinery is part of ceridwen (vendored from
# sedpy-jax, which is no longer a dependency), and FilterSet cannot resolve a
# filter name without them.  ~14 MB over 293 .par files.
ceridwen = [
    "data/filters/*.par",
    "data/alpha_lyr_stis_005.fits",
    "data/sun_kurucz93.fits",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fsps: requires a working FSPS install (deselect with -m 'not fsps')",
    "gpu: requires a GPU (deselect with -m 'not gpu')",
    "prospector: compares against a reference dump of the installed Prospector (tests/reference)",
]
# Silence third-party deprecation noise we can't fix (tensorflow-probability's
# JAX substrate, pkg_resources). We deliberately do NOT blanket-ignore
# DeprecationWarning, so genuine deprecations in ceridwen's own code still show.
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow_probability.*",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
