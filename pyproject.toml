[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceridwen"
version = "0.2.0"
description = "JAX-native, GPU-capable SED fitting with VI-preconditioned HMC"
readme = "README.md"
# Python 3.11+ required: nested sampling pins official blackjax (main), which
# itself requires >=3.11. When blackjax ships NSS in a PyPI release this stays
# >=3.11 and the git pin below becomes a normal version pin.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amanda Stoffers", email = "aas208@cam.ac.uk" }]
keywords = ["astronomy", "astrophysics", "SED fitting", "JAX", "HMC", "stellar populations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies.  These are everything needed for
# ``import ceridwen`` and the README quick-start (forward model, priors,
# default NUTS/nested sampling, HDF5 I/O) to work on a clean environment.
#
# Lower bounds are taken from the known-good environment.yml; loosen only
# after testing.  Notably:
#   * jax>=0.4.30  -- jnp.trapezoid, modern jax.tree_util, 2024 PRNG conventions.
#   * sedpy-jax    -- DISTRIBUTION name is "sedpy-jax"; IMPORT name is "sedpy_jax".
#                     Imported at module scope (dust/DustModel.py) so it is
#                     mandatory just to import the package.
#   * tensorflow-probability -- every prior uses tfp.substrates.jax.
#   * blackjax     -- nested sampling (blackjax.nss / blackjax.ns) is now MERGED
#                     into the official blackjax (blackjax-devs), but not yet in a
#                     tagged PyPI release (latest is 1.5, pre-merge). We therefore
#                     pin the official repo at a fixed commit. This direct git
#                     reference still means ceridwen cannot be uploaded to PyPI.
#                     Pinned SHA f73e12956 = the maintainer-validated environment
#                     (blackjax 1.6.dev98+gf73e12956), so every install is
#                     bit-identical to the tested one.
#                     TODO(switch ASAP): when a blackjax release ships NSS, replace
#                     this with `blackjax>=X.Y` to restore PyPI-installability.
#   * sedpy-jax    -- >=0.1.1 carries the `inres` arg of make_lsf_smoother + the
#                     LOSVD FFT wrap-around fix (published to PyPI). The older
#                     0.1.0 lacks them, so the floor must exclude it.
dependencies = [
    # GPU by default where CUDA exists: on Linux the CUDA 12 jaxlib wheels are
    # installed (CUDA libraries bundled -- an NVIDIA driver >= 525 is the only
    # system requirement).  JAX picks the GPU automatically at import time; on
    # a Linux box WITHOUT a usable NVIDIA GPU the same install falls back to
    # CPU at runtime (one warning at import, identical results).  macOS and
    # native Windows have no CUDA wheels, so they get the CPU build; Windows
    # users with an NVIDIA GPU should install inside WSL2 (which is Linux, so
    # the CUDA path applies).  The fitSED header "Device : ..." shows which
    # backend a fit is actually using.
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
    "jax>=0.4.30; sys_platform != 'linux'",
    "jaxlib>=0.4.30",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "astropy>=5.3",
    "sedpy-jax>=0.1.1",
    "tensorflow-probability>=0.23",
    "blackjax @ git+https://github.com/blackjax-devs/blackjax@f73e12956",
    "tqdm>=4.65",
    "fastprogress>=1.0",  # blackjax.window_adaptation's progress bar imports this
                          # lazily; it is not pulled in by the pinned blackjax, so
                          # NUTS warmup crashes on a clean install without it.
    # Everything needed to import, fit, plot, and test CERIDWEN is core, so a
    # plain `pip install .` gives a fully-featured install with no extras to
    # choose. (VI + nested-sampling plotting + the test runner are all here.)
    "optax>=0.2.0",       # VI (NeuTra) preconditioning training loop
    "anesthetic>=2.8",    # nested-sampling posteriors, evidence, corner plots
    "pytest>=7.0",        # test runner (so `pytest` works with no extra install)
]

# The ONE thing that cannot be a core dependency is FSPS (`python-fsps`): it is
# not a pure-Python wheel — it compiles Fortran against $SPS_HOME at install
# time, so bundling it would make `pip install` fail on any machine without a
# Fortran compiler and $SPS_HOME set. FSPS is a documented prerequisite instead
# (see the README "Installing FSPS" section): install it with `pip install fsps`.

[project.optional-dependencies]
# Maintainer-only: tooling to build the documentation site. Not needed to use
# or test CERIDWEN.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "black>=24.0"]

[project.urls]
Homepage = "https://github.com/Espe13/ceridwen"
Source = "https://github.com/Espe13/ceridwen"
Issues = "https://github.com/Espe13/ceridwen/issues"

[tool.setuptools.packages.find]
# Ship only the importable package; keep scripts/, tests/, notebooks/,
# animation/, presentations/, Method_Paper/, etc. out of the wheel.
include = ["ceridwen*"]
exclude = ["tests*", "scripts*", "notebooks*", "animation*", "presentations*", "GPU*"]

[tool.setuptools.package-data]
# Do NOT bundle the 178 MB ceridwen/data/test_data/*.h5 grids into the wheel.
# List small, genuinely-required data files here explicitly if any exist.
ceridwen = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fsps: requires a working FSPS install (deselect with -m 'not fsps')",
    "gpu: requires a GPU (deselect with -m 'not gpu')",
]
# Silence third-party deprecation noise we can't fix (tensorflow-probability's
# JAX substrate, pkg_resources). We deliberately do NOT blanket-ignore
# DeprecationWarning, so genuine deprecations in ceridwen's own code still show.
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow_probability.*",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]
