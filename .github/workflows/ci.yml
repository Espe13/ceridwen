name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Smoke test: the single most important signal for a stranger -- does the
  # package install from a clean environment and import on CPU?  Importing
  # ceridwen.sampler additionally exercises the blackjax / tensorflow-
  # probability floors declared in pyproject.toml, so a bad dependency pin
  # fails here rather than silently at a user's first fit.
  # This job must stay green.
  # ----------------------------------------------------------------------
  smoke:
    name: smoke (import) py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core deps only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import package + public API
        run: |
          python - <<'PY'
          import ceridwen
          print("ceridwen", ceridwen.__version__)

          # Public top-level API (declared in ceridwen.__all__).
          from ceridwen import DustModel, DustEmission, NebularModel, fitSED, read_result_h5

          # Submodule imports that pull the heavier optional-at-runtime deps,
          # so a broken floor (sedpy-jax / astropy / tfp / blackjax) is caught
          # at CI time rather than by the first user.
          import ceridwen.csp.csp            # astropy, sedpy_jax
          import ceridwen.observation.observation
          import ceridwen.sampler            # tensorflow-probability, blackjax
          from ceridwen.sampler import Uniform, ClippedNormal, StudentT
          print("import smoke test OK")
          PY

  # ----------------------------------------------------------------------
  # Test suite.  NOTE: several tests load ceridwen/data/test_data/*.h5, which
  # are NOT committed to git (~178 MB), and some require a working FSPS install
  # (marked `fsps`) or a GPU (marked `gpu`).  Until a small committed fixture
  # grid lands (see RELEASE_CHECKLIST item 11), this job is expected to be
  # partially red -- it is marked continue-on-error so it does not block, and
  # should be made required once the fixtures exist.
  # ----------------------------------------------------------------------
  tests:
    name: pytest (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[nested,vi,test]"

      - name: Run tests (skip FSPS- and GPU-only tests)
        run: |
          pytest -m "not fsps and not gpu" -ra
